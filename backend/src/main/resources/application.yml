server:
  port: ${PORT:8000}
spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bmc_meetings}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:1234}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
bmc:
  public-base-url: ${PUBLIC_BASE_URL:http://127.0.0.1:8000}
  admin-email: ${ADMIN_EMAIL:admin@bukobamc.go.tz}
  admin-password: ${ADMIN_PASSWORD:admin123}
  default-whatsapp-sender: ${WHATSAPP_DEFAULT_SENDER:0757219157}
  default-email-sender: ${SMTP_FROM:theagaba.dev@gmail.com}
  whatsapp-enabled: ${WHATSAPP_ENABLED:false}
  whatsapp-use-templates: ${WHATSAPP_USE_TEMPLATES:true}
  whatsapp-template-name: ${WHATSAPP_TEMPLATE_NAME:hello_world}
  whatsapp-template-name-meeting: ${WHATSAPP_TEMPLATE_NAME_MEETING:bmc_meetings}
  whatsapp-template-language: ${WHATSAPP_TEMPLATE_LANGUAGE:en_US}
  whatsapp-template-parameter-count: ${WHATSAPP_TEMPLATE_PARAMETER_COUNT:0}
  whatsapp-api-url: ${WHATSAPP_API_URL:https://graph.facebook.com/v21.0}
  whatsapp-access-token: ${WHATSAPP_ACCESS_TOKEN:}
  whatsapp-default-phone-id: ${WHATSAPP_PHONE_NUMBER_ID:${WHATSAPP_DEFAULT_PHONE_NUMBER_ID:}}
  whatsapp-default-waba-id: ${WHATSAPP_DEFAULT_WABA_ID:}
  whatsapp-app-secret: ${WHATSAPP_APP_SECRET:}
  whatsapp-webhook-verify-token: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:}
  otp-expiry-minutes: ${OTP_EXPIRY_MINUTES:10}
  qr-rotation-seconds: ${QR_ROTATION_SECONDS:45}
  session-days: ${SESSION_DAYS:7}
  pending-registration-hours: ${PENDING_REGISTRATION_HOURS:24}
  cloudinary-url: ${CLOUDINARY_URL:}
logging:
  level:
    root: INFO
    tz.go.bukobamc.meetings: INFO
    org.springframework.web: INFO
